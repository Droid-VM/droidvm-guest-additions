PACKAGE_NAME="droidvm-guest-additions"
PACKAGE_VERSION="1.0"

# Build both modules in one pass via the top-level Makefile: gunyah_guest first
# (exports Module.symvers), then the patched virtio-gpu against it.
MAKE[0]="make KDIR=/lib/modules/${kernelver}/build"
CLEAN="make clean KDIR=/lib/modules/${kernelver}/build"

BUILT_MODULE_NAME[0]="gunyah_guest"
BUILT_MODULE_LOCATION[0]="gunyah_guest/"
DEST_MODULE_LOCATION[0]="/updates/dkms"

BUILT_MODULE_NAME[1]="virtio-gpu"
BUILT_MODULE_LOCATION[1]="virtio_gpu/"
# Installs under updates/dkms which depmod prefers over the in-tree virtio-gpu.
DEST_MODULE_LOCATION[1]="/updates/dkms"

# NOTE: the runtime memparcel accept transport (crosvm VmAccept::Sync) is now
# folded INTO gunyah_guest.ko (module[0]) -- it registers the virtio accept
# driver from gunyah_guest_init(). No separate module.

# Rebuild automatically when the guest kernel is upgraded.
AUTOINSTALL="yes"

# NO REMAKE_INITRD here, deliberately. dkms 3.2.2 prints "Deprecated feature: REMAKE_INITRD" and
# then does nothing -- measured, not assumed: after an install that logged that line, the
# initramfs mtime had not moved. Setting it would put a claim in the log that the initramfs was
# handled while virtio-gpu, which early KMS loads FROM the initramfs, was still the old one.
#
# The two paths that need it are covered elsewhere:
#   install/remove now  -> packaging/hooks.sh calls update-initramfs or dracut itself
#   kernel upgrade      -> /etc/kernel/postinst.d/dkms runs dkms_autoinstaller for the new kernel
#                          before that kernel's initramfs is generated (the same ordering every
#                          other DKMS package on the distro relies on)

# The vendored virtio-gpu sources track the 7.x driver; bound the supported
# range until per-series bases land (see README).
BUILD_EXCLUSIVE_KERNEL="^7\..*"
